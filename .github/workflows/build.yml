name: Build Mod Manager
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Record build environment
        run: |
          mkdir -p diagnostics
          {
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS"
            echo "Java:"
            java -version 2>&1
            echo "Gradle:"
            gradle --version
          } > diagnostics/build-environment.txt
      - name: Build with full diagnostics
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace --info 2>&1 | tee diagnostics/gradle-build.log
      - name: Upload mod JAR
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mod-manager-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload exact build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-manager-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail workflow when build failed
        if: steps.build.outcome != 'success'
        run: exit 1
