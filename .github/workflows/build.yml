name: Build Mod Manager
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        run: gradle build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-manager-1.21.11
          path: build/libs/*.jar
